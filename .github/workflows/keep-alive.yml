name: Keep Supabase Alive

on:
  schedule:
    - cron: "17 3 */3 * *" # a cada 3 dias, fora do pico de agendamentos do GitHub
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl --fail --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            -X GET "${{ secrets.VERCEL_URL }}/internal/keepalive" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}"
