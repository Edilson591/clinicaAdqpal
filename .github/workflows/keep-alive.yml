name: Keep Supabase Alive

on:
  schedule:
    # O Supabase Free considera a atividade dos últimos 7 dias e recomenda
    # algumas consultas por dia para evitar a pausa por inatividade.
    - cron: "17 3,11,19 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 30 \
            --retry-max-time 300 --connect-timeout 15 --max-time 120 \
            -X GET "${{ secrets.VERCEL_URL }}/internal/keepalive" \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}"
